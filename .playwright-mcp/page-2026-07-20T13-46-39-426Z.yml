      - generic [ref=f1e220]:
        - heading "FAQs" [level=2] [ref=f1e221]
        - generic [ref=f1e222]:
          - generic [ref=f1e223]:
            - button "What is AutoTree and who is it for?" [ref=f1e224] [cursor=pointer]
            - generic: "AutoTree is an open-source serving engine that executes LLM reasoning as a tree: one shared prefix, many candidate branches, weak branches pruned mid-flight with their memory reclaimed instantly. It is built for teams running reasoning workloads, best-of-n sampling, RL rollout generation, and agentic search."
          - generic [ref=f1e229]:
            - button "How is this different from prefix caching in vLLM or SGLang?" [ref=f1e230] [cursor=pointer]
            - generic: Prefix caching shares the prompt across requests. It cannot share generated tokens, because the prefix does not exist until someone generates it. AutoTree forks the KV cache mid-generation, so branches share the reasoning computed so far, and pruned branches return their memory to the pool while the request is still running.
          - generic [ref=f1e235]:
            - button "Is it production ready?" [ref=f1e236] [cursor=pointer]
            - generic: The reference engine is open source today with the full test suite, measured results, and an honest limitations list. A production-speed engine built on SGLang's runtime, inheriting its continuous batching and speed with tree execution added, is in active development in the open.
          - generic [ref=f1e241]:
            - button "Where are the benchmarks against vLLM and SGLang?" [ref=f1e242] [cursor=pointer]
            - generic: "Running now. The protocol is public before the results: baselines run with prefix caching enabled and their best flags, full branch-count sweeps rather than cherry-picked points, ablations that isolate where wins come from, and two workloads where we expect parity or worse, published anyway. Every number will ship with configs, seeds, and raw logs."
          - generic [ref=f1e247]:
            - button "What is the value scorer?" [ref=f1e248] [cursor=pointer]
            - generic: "The component that decides which branches live. AutoTree ships with a pluggable scoring interface: log-probability, self-consistency voting, or your own reward model. Our published measurements show naive scoring is not enough, which is precisely why the interface is open and the baseline is public."
          - generic [ref=f1e253]:
            - button "Is it really open source?" [ref=f1e254] [cursor=pointer]
            - generic [ref=f1e258]:
              - text: Yes. Apache-2.0, no strings. The engine, the benchmark harness, the results data, and the paper-grade validation evidence are all in
              - link "the repository" [ref=f1e259] [cursor=pointer]:
                - /url: https://github.com/RightNow-AI/autotree
              - text: .
          - generic [ref=f1e260]:
            - button "Can we get support running it?" [ref=f1e261] [cursor=pointer]
            - generic [ref=f1e265]:
              - text: Enterprise deployments, Helm charts, SLURM templates, and dashboards ship in the repository. For dedicated support,
              - link "contact us" [ref=f1e266] [cursor=pointer]:
