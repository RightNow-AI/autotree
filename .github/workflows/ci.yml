name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Create Python 3.12 environment
        working-directory: core
        run: uv venv --python 3.12 --clear
      - name: Install core development dependencies
        working-directory: core
        run: uv pip install -e ".[dev]"
      - name: Run core KV and kernel tests
        working-directory: core
        run: uv run --no-sync pytest -q tests/kv tests/kernels
      - name: Parse workflow YAML
        run: >-
          uv run --with pyyaml python -c
          "import pathlib,yaml; files=[pathlib.Path('.github/workflows/ci.yml'),pathlib.Path('.github/workflows/gpu-parity.yml')]; [yaml.safe_load(path.read_text(encoding='utf-8')) for path in files]; print('Parsed workflow YAML:', ', '.join(map(str, files)))"

  scheduler:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scheduler -> target
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run scheduler tests
        run: cargo test
      - name: Check Python bindings
        run: cargo check --features python

  serve:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect serve package
        id: serve
        shell: bash
        run: |
          if [[ -d serve ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::serve/ is absent; skipping the serve gate until that package merges."
          fi
      - name: Install uv
        if: steps.serve.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: serve/uv.lock
      - name: Create Python 3.12 environment
        if: steps.serve.outputs.present == 'true'
        working-directory: serve
        run: uv venv --python 3.12 --clear
      - name: Install serve development dependencies
        if: steps.serve.outputs.present == 'true'
        working-directory: serve
        run: uv pip install -e ".[dev]"
      - name: Run serve tests
        if: steps.serve.outputs.present == 'true'
        working-directory: serve
        run: uv run --no-sync pytest -q

  modeling:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Create Python 3.12 environment
        working-directory: core
        run: uv venv --python 3.12 --clear
      - name: Install core modeling dependencies
        working-directory: core
        run: uv pip install -e ".[dev,modeling]"
      - name: Run core tests with modeling dependencies
        working-directory: core
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: uv run --no-sync pytest -q tests
